<title>カウンセリングマップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: sidebar of students (roster) + student page with a session timeline; maps open in a full-screen canvas editor. */
:root {
  --bg: #f3f6f5;
  --panel: #ffffff;
  --ink: #1d2b2a;
  --muted: #5f706e;
  --line: #d9e2e0;
  --accent: #1f6f66;
  --accent-soft: #e2efec;
  --danger: #b4382f;
  --canvas: #fbfcfc;
  --grid: #e8eeed;
  --b1: #2f7f73; --b2: #c0762c; --b3: #4f6db8; --b4: #a24f86; --b5: #6b8a2e; --b6: #8a6a4a;
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Noto Sans JP", sans-serif;
  --font-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111816; --panel: #19221f; --ink: #e4ecea; --muted: #94a5a2; --line: #2c3936;
  --accent: #5cc0b2; --accent-soft: #1f3330; --danger: #ef7d73; --canvas: #141c1a; --grid: #1d2826;
  --b1: #5cc0b2; --b2: #e5a35e; --b3: #8aa4ec; --b4: #d68cbd; --b5: #a5c766; --b6: #c9a684;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111816; --panel: #19221f; --ink: #e4ecea; --muted: #94a5a2; --line: #2c3936;
  --accent: #5cc0b2; --accent-soft: #1f3330; --danger: #ef7d73; --canvas: #141c1a; --grid: #1d2826;
  --b1: #5cc0b2; --b2: #e5a35e; --b3: #8aa4ec; --b4: #d68cbd; --b5: #a5c766; --b6: #c9a684;
  color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.6; }
* { box-sizing: border-box; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }

.app { display: grid; grid-template-columns: 280px 1fr; height: 100%; }
@media (max-width: 760px) { .app { grid-template-columns: 1fr; height: auto; min-height: 100%; } }

/* Sidebar */
.side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
@media (max-width: 760px) { .side { border-right: 0; border-bottom: 1px solid var(--line); max-height: 46vh; } }
.brand { padding: 18px 16px 10px; display: flex; align-items: baseline; gap: 8px; }
.brand h1 { font-size: 19px; color: var(--accent); }
.brand small { color: var(--muted); font-size: 11px; }
.side-tools { padding: 0 16px 12px; display: grid; gap: 8px; }
.search { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.roster { list-style: none; margin: 0; padding: 0 8px 16px; overflow-y: auto; flex: 1; min-height: 0; }
.roster li button { width: 100%; text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 8px; display: grid; gap: 1px; }
.roster li button:hover { background: var(--accent-soft); }
.roster li button[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.roster .nm { font-weight: 700; }
.roster .meta { font-size: 12px; color: var(--muted); }
.roster .due { color: var(--b2); font-weight: 700; }
.roster-empty { color: var(--muted); padding: 12px 10px; font-size: 13px; }

.btn { border: 1px solid var(--line); background: var(--panel); padding: 7px 12px; border-radius: 8px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); font-weight: 700; }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: var(--panel); border-color: var(--danger); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.sm { padding: 4px 9px; font-size: 13px; }

/* Main */
.main { overflow-y: auto; min-width: 0; padding-block: 24px 48px; padding-inline: 28px; }
@media (max-width: 760px) { .main { padding-inline: 16px; } }
.status-bar { font-size: 12px; color: var(--muted); margin-bottom: 12px; min-height: 18px; }
.status-bar.err { color: var(--danger); }

.empty { max-width: 560px; margin: 8vh auto; text-align: center; color: var(--muted); }
.empty h2 { color: var(--ink); font-size: 22px; margin-bottom: 8px; }
.empty ol { text-align: left; display: inline-block; margin: 16px 0 20px; }

.student-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.student-head h2 { font-size: 26px; }
.student-head .kana { color: var(--muted); font-size: 13px; }

.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 20px; align-items: start; }
@media (max-width: 1000px) { .grid2 { grid-template-columns: 1fr; } }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.card h3 { font-size: 15px; margin-bottom: 12px; }
.form { display: grid; gap: 10px; }
.form label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); letter-spacing: .03em; }
.form input, .form textarea, .form select { padding: 7px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); font-size: 14px; color: var(--ink); width: 100%; }
.form textarea { min-height: 80px; resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-foot { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 4px; }

.progress { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.ticks { display: flex; gap: 3px; flex-wrap: wrap; }
.ticks span { width: 12px; height: 12px; border-radius: 3px; background: var(--grid); border: 1px solid var(--line); }
.ticks span.done { background: var(--accent); border-color: var(--accent); }
.ticks span.rev { outline: 2px solid var(--b2); outline-offset: 1px; }
.progress .lbl { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.tl-item { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
.tl-item.next { border-style: dashed; background: transparent; }
.tl-no { font-family: var(--font-display); font-weight: 700; text-align: center; line-height: 1.2; color: var(--accent); }
.tl-no b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.tl-no small { font-size: 11px; color: var(--muted); font-weight: 500; }
.tl-body { min-width: 0; }
.tl-body .t { font-weight: 700; }
.tl-body .s { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); margin-right: 6px; vertical-align: 1px; }
.chip.rev { background: color-mix(in srgb, var(--b2) 16%, transparent); color: var(--b2); }
.tl-actions { display: flex; gap: 6px; }

/* Dialog */
.modal-bg { position: fixed; inset: 0; background: rgba(10, 20, 18, .45); display: grid; place-items: center; padding: 16px; z-index: 30; }
.modal { background: var(--panel); border-radius: 12px; padding: 20px; width: min(440px, 100%); display: grid; gap: 14px; border: 1px solid var(--line); }
.modal h3 { font-size: 17px; }
.tpl { display: grid; gap: 8px; }
.tpl label { display: flex; gap: 10px; align-items: flex-start; padding: 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.tpl label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.tpl small { display: block; color: var(--muted); font-size: 12px; }

/* Editor */
.editor { position: fixed; inset: 0; background: var(--canvas); z-index: 20; display: flex; flex-direction: column; }
.ed-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top, 0px)); border-bottom: 1px solid var(--line); background: var(--panel); }
.ed-title { display: flex; align-items: center; gap: 8px; flex: 1 1 260px; min-width: 0; }
.ed-title input { border: 1px solid transparent; background: transparent; font-family: var(--font-display); font-weight: 700; font-size: 17px; padding: 3px 6px; border-radius: 6px; min-width: 0; flex: 1; }
.ed-title input:hover, .ed-title input:focus { border-color: var(--line); }
.ed-title .who { color: var(--muted); font-size: 13px; white-space: nowrap; }
.ed-tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sep { width: 1px; height: 22px; background: var(--line); }
.swatches { display: flex; gap: 4px; }
.swatches button { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line); padding: 0; }
.save-state { font-size: 12px; color: var(--muted); min-width: 64px; text-align: right; }
.save-state.err { color: var(--danger); }
.ed-body { flex: 1; display: grid; grid-template-columns: 1fr; min-height: 0; }
.ed-body.split { grid-template-columns: 1fr 1fr; }
@media (max-width: 760px) { .ed-body.split { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
.pane { position: relative; overflow: hidden; min-width: 0; min-height: 0; touch-action: none;
  background-image: radial-gradient(var(--grid) 1.2px, transparent 1.2px); background-size: 22px 22px; }
.pane + .pane { border-left: 1px solid var(--line); }
@media (max-width: 760px) { .pane + .pane { border-left: 0; border-top: 1px solid var(--line); } }
.pane-label { position: absolute; top: 10px; left: 12px; font-size: 12px; background: var(--panel); border: 1px solid var(--line); padding: 2px 9px; border-radius: 99px; color: var(--muted); z-index: 2; }
.pane svg { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; -webkit-user-select: none; }
.pane svg.panning { cursor: grabbing; }
.node rect { stroke-width: 1.5; }
.node text { font-family: var(--font-body); fill: var(--ink); }
.node.root text { font-family: var(--font-display); font-weight: 700; fill: var(--panel); }
.node.sel rect { stroke: var(--accent) !important; stroke-width: 3; }
.node { cursor: pointer; }
.edge { fill: none; stroke-width: 2.4; stroke-linecap: round; }
.node-edit { position: absolute; z-index: 5; border: 2px solid var(--accent); border-radius: 8px; background: var(--panel); padding: 6px 10px; font-size: 14px; line-height: 20px; resize: none; overflow: hidden; box-shadow: 0 6px 18px rgba(0,0,0,.14); }
.hint { position: absolute; bottom: 10px; left: 12px; right: 12px; font-size: 12px; color: var(--muted); pointer-events: none; padding-bottom: env(safe-area-inset-bottom, 0px); }
@media (max-width: 760px) { .hint { display: none; } }
.zoom { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 4px; z-index: 2; margin-bottom: env(safe-area-inset-bottom, 0px); }
.zoom .btn { background: var(--panel); padding: 4px 10px; }

@media (prefers-reduced-motion: no-preference) { .roster li button, .btn { transition: background .15s, border-color .15s; } }
</style>

<div class="app" id="app">
  <aside class="side">
    <div class="brand"><h1>カウンセリングマップ</h1></div>
    <div class="side-tools">
      <button class="btn primary" id="addStudent">＋ 生徒を追加</button>
      <input class="search" id="search" type="search" placeholder="名前・ふりがなで検索" aria-label="生徒を検索">
    </div>
    <ul class="roster" id="roster"><li class="roster-empty">読み込み中…</li></ul>
  </aside>
  <main class="main" id="main">
    <div class="status-bar" id="status"></div>
    <div id="view"></div>
  </main>
</div>
<div id="modalRoot"></div>
<div id="editorRoot"></div>

<script>
"use strict";
// ---------- helpers ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const fmtDate = s => s ? s.replace(/^(\d{4})-(\d{2})-(\d{2})$/, (_, y, m, d) => `${y}/${+m}/${+d}`) : "日付未設定";
const BRANCH = ["--b1", "--b2", "--b3", "--b4", "--b5", "--b6"];
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function mix(a, b, t) {
  const h = c => { c = c.replace("#", ""); if (c.length === 3) c = [...c].map(x => x + x).join(""); return [0, 2, 4].map(i => parseInt(c.slice(i, i + 2), 16)); };
  try { const A = h(a), B = h(b); return "#" + A.map((v, i) => Math.round(v * t + B[i] * (1 - t)).toString(16).padStart(2, "0")).join(""); } catch { return b; }
}
const REVIEW_EVERY = 6;

const state = { db: null, downloads: null, students: [], maps: [], selected: null, query: "", loaded: false, offline: false };

function setStatus(msg, err) { const el = $("#status"); el.textContent = msg || ""; el.classList.toggle("err", !!err); }

// ---------- data layer (db capability, with in-memory fallback) ----------
async function write(path, data, mode = "set") {
  if (!state.db) { localApply(path, data, mode); return; }
  try { await state.db.doc(path)[mode](data); }
  catch (e) {
    if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 600 + Math.random() * 600)); await state.db.doc(path)[mode](data); return; }
    throw e;
  }
}
async function remove(path) { if (!state.db) { localApply(path, null, "delete"); return; } await state.db.doc(path).delete(); }
function localApply(path, data, mode) {
  const [col, id] = path.split("/"); const arr = col === "students" ? state.students : state.maps;
  const i = arr.findIndex(x => x.id === id);
  if (mode === "delete") { if (i >= 0) arr.splice(i, 1); }
  else if (mode === "update" && i >= 0) Object.assign(arr[i], data);
  else { const d = { ...data, id }; if (i >= 0) arr[i] = d; else arr.push(d); }
  renderAll();
}

async function boot() {
  renderAll();
  try { state.db = await window.claude?.use?.("db") ?? null; } catch { state.db = null; }
  try { state.downloads = await window.claude?.use?.("downloads") ?? null; } catch { state.downloads = null; }
  if (!state.db) {
    state.offline = true; state.loaded = true;
    setStatus("この画面ではクラウド保存が使えません。入力内容はページを閉じると消えます。", true);
    renderAll(); return;
  }
  state.db.collection("students").onSnapshot(snap => {
    state.students = snap.docs.map(d => ({ ...d.data(), id: d.id })); state.loaded = true; renderAll();
  }, e => setStatus("生徒データを読み込めませんでした（" + e.code + "）。ページを再読み込みしてください。", true));
  state.db.collection("maps").onSnapshot(snap => {
    state.maps = snap.docs.map(d => ({ ...d.data(), id: d.id })); renderAll(); editor?.onRemote();
  }, e => setStatus("マップを読み込めませんでした（" + e.code + "）。ページを再読み込みしてください。", true));
}

// ---------- derived ----------
const mapsOf = sid => state.maps.filter(m => m.studentId === sid).sort((a, b) => (a.session ?? 0) - (b.session ?? 0) || String(a.date).localeCompare(String(b.date)));
// The first 6th-session review that has no map yet (may already be overdue).
const nextReview = s => { const done = new Set(mapsOf(s.id).filter(m => m.kind === "review").map(m => m.session)); let k = REVIEW_EVERY; while (done.has(k)) k += REVIEW_EVERY; return k; };
function reviewDue(s) {
  const n = +s.lessons || 0; if (n < REVIEW_EVERY) return false;
  const last = Math.floor(n / REVIEW_EVERY) * REVIEW_EVERY;
  return !mapsOf(s.id).some(m => m.kind === "review" && m.session === last);
}
function kindLabel(m) { return m.kind === "initial" ? "初回カウンセリング" : m.kind === "review" ? `第${m.session}回 振り返り` : "フリーマップ"; }

// ---------- render: roster ----------
function renderRoster() {
  const ul = $("#roster");
  if (!state.loaded) return;
  const q = state.query.trim().toLowerCase();
  const list = state.students.filter(s => !q || (s.name || "").toLowerCase().includes(q) || (s.kana || "").toLowerCase().includes(q))
    .sort((a, b) => (a.kana || a.name || "").localeCompare(b.kana || b.name || "", "ja"));
  if (!state.students.length) { ul.innerHTML = `<li class="roster-empty">まだ生徒がいません。「＋ 生徒を追加」から登録してください。</li>`; return; }
  if (!list.length) { ul.innerHTML = `<li class="roster-empty">「${esc(state.query)}」に一致する生徒はいません。</li>`; return; }
  ul.innerHTML = list.map(s => {
    const due = reviewDue(s);
    return `<li><button data-sid="${esc(s.id)}" aria-current="${s.id === state.selected}">
      <span class="nm">${esc(s.name || "（名前なし）")}</span>
      <span class="meta">${esc(s.course || "コース未設定")} ・ ${+s.lessons || 0}回受講${due ? ' ・ <span class="due">振り返り時期</span>' : ""}</span>
    </button></li>`;
  }).join("");
}

// ---------- render: main ----------
function renderMain() {
  const view = $("#view");
  const s = state.students.find(x => x.id === state.selected);
  if (!s) {
    if (document.activeElement && view.contains(document.activeElement)) return;
    view.innerHTML = `<div class="empty">
      <h2>${state.students.length ? "左のリストから生徒を選んでください" : "最初の生徒を登録しましょう"}</h2>
      <p>生徒ごとに、初回カウンセリングと6回ごとの振り返りのマインドマップを時系列で残せます。</p>
      <ol><li>生徒を追加して、基本情報を入力</li><li>「初回カウンセリング」マップを作成</li><li>6回ごとに「振り返り」マップを作成し、前回と並べて比較</li></ol><br>
      <button class="btn primary" data-act="add-student">＋ 生徒を追加</button></div>`;
    return;
  }
  // Keep the profile form intact while the user types in it.
  const form = $("#profileForm");
  const typing = form && form.dataset.sid === s.id && form.contains(document.activeElement);
  const maps = mapsOf(s.id);
  const n = +s.lessons || 0;
  const hasInitial = maps.some(m => m.kind === "initial");
  const nr = nextReview(s);
  const ticksTotal = Math.max(12, Math.ceil((n + 1) / REVIEW_EVERY) * REVIEW_EVERY);
  const ticks = Array.from({ length: ticksTotal }, (_, i) => `<span class="${i < n ? "done" : ""} ${(i + 1) % REVIEW_EVERY === 0 ? "rev" : ""}" title="第${i + 1}回"></span>`).join("");
  const reviewSessions = new Set(maps.filter(m => m.kind === "review").map(m => m.session));
  const suggested = [];
  if (!hasInitial) suggested.push({ kind: "initial", session: 0 });
  for (let k = REVIEW_EVERY; k <= Math.max(n, nr); k += REVIEW_EVERY) if (!reviewSessions.has(k)) { suggested.push({ kind: "review", session: k }); }

  const items = maps.map(m => {
    const count = Array.isArray(m.nodes) ? m.nodes.length : 0;
    const top = (m.nodes || []).filter(x => x.parent === (m.nodes || [])[0]?.id).map(x => x.text).filter(Boolean).slice(0, 4).join(" / ");
    return `<li class="tl-item">
      <div class="tl-no">${m.kind === "initial" ? "<b>初</b><small>初回</small>" : m.kind === "review" ? `<b>${m.session}</b><small>回目</small>` : "<b>・</b><small>メモ</small>"}</div>
      <div class="tl-body"><div class="t"><span class="chip ${m.kind === "review" ? "rev" : ""}">${m.kind === "initial" ? "初回" : m.kind === "review" ? "振り返り" : "フリー"}</span>${esc(m.title || kindLabel(m))}</div>
        <div class="s">${esc(fmtDate(m.date))} ・ ${count}項目${top ? " ・ " + esc(top) : ""}</div></div>
      <div class="tl-actions"><button class="btn sm primary" data-open="${esc(m.id)}">開く</button></div>
    </li>`;
  }).join("");
  const next = suggested.slice(0, 2).map(x => `<li class="tl-item next">
      <div class="tl-no">${x.kind === "initial" ? "<b>初</b><small>初回</small>" : `<b>${x.session}</b><small>回目</small>`}</div>
      <div class="tl-body"><div class="t">${x.kind === "initial" ? "初回カウンセリング" : `第${x.session}回 振り返り`}</div>
        <div class="s">${x.kind === "initial" ? "まだ作成されていません" : x.session <= n ? "振り返りの時期です" : `あと${x.session - n}回で振り返り`}</div></div>
      <div class="tl-actions"><button class="btn sm" data-new-kind="${x.kind}" data-new-session="${x.session}">＋ 作成</button></div>
    </li>`).join("");

  const profileHtml = `<form class="form" id="profileForm" data-sid="${esc(s.id)}">
      <div class="row2"><label>名前<input id="f-name" name="name" value="${esc(s.name)}" required></label>

function renderAll() { renderRoster(); renderMain(); }

// ---------- templates ----------
function tplNodes(kind, student, session) {
  const root = { id: uid(), parent: null, text: "" };
  let kids = [];
  if (kind === "initial") {
    root.text = (student.name || "生徒") + "さん\n初回カウンセリング";
    kids = ["今の状況", "理想の姿・ゴール", "なぜ叶えたい？", "課題・不安", "強み・好きなこと", "使える時間・生活リズム", "最初の一歩"];
  } else if (kind === "review") {
    root.text = (student.name || "生徒") + "さん\n第" + session + "回 振り返り";
    kids = ["できたこと", "うまくいかなかったこと", "気づき・学び", "ゴールとの距離", "次の6回でやること"];
  } else root.text = (student.name || "生徒") + "さん";
  const nodes = [root];
  kids.forEach((t, i) => nodes.push({ id: uid(), parent: root.id, text: t, color: i % BRANCH.length, side: i % 2 ? "L" : "R" }));
  return nodes;
}

// ---------- modals ----------
function openModal(html, onMount) {
  const root = $("#modalRoot");
  root.innerHTML = `<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const bg = root.firstElementChild;
  bg.addEventListener("mousedown", e => { if (e.target === bg) closeModal(); });
  bg.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
  onMount?.(bg);
  setTimeout(() => bg.querySelector("input:not([type=radio]), button.primary")?.focus(), 0);
}
function closeModal() { $("#modalRoot").innerHTML = ""; }

function addStudentDialog() {
  openModal(`<h3>生徒を追加</h3>
    <form class="form" id="addForm">
      <label>名前<input id="a-name" name="name" required></label>
      <label>ふりがな<input id="a-kana" name="kana"></label>
      <div class="row2"><label>コース・プラン<input id="a-course" name="course"></label>
      <label>開始日<input id="a-start" name="start" type="date" value="${today()}"></label></div>
      <label style="flex-direction:row;display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px"><input type="checkbox" id="a-initial" checked style="width:auto"> 初回カウンセリングのマップも作成する</label>

async function createMap(s, kind, session, open, date) {
  const id = uid();
  const m = { studentId: s.id, kind, session, date: date || today(), title: kind === "initial" ? "初回カウンセリング" : kind === "review" ? `第${session}回 振り返り` : "フリーマップ", nodes: tplNodes(kind, s, session), rev: uid(), updatedAt: Date.now() };

// ---------- mind map renderer ----------
const measureCtx = document.createElement("canvas").getContext("2d");
function textBox(text, root) {
  measureCtx.font = root ? `700 17px ${cssVar("--font-display")}` : `400 14px ${cssVar("--font-body")}`;
  const lines = String(text || " ").split("\n");
  const w = Math.max(...lines.map(l => measureCtx.measureText(l || " ").width));
  const lh = root ? 24 : 20;
  return { lines, w: Math.ceil(Math.max(w, root ? 60 : 28)) + (root ? 40 : 24), h: lines.length * lh + (root ? 24 : 14), lh };
}

function layout(nodes) {
  const byId = new Map(nodes.map(n => [n.id, n]));
  const kids = new Map(nodes.map(n => [n.id, []]));
  for (const n of nodes) if (n.parent && kids.has(n.parent)) kids.get(n.parent).push(n);
  const root = nodes[0];
  const pos = new Map();
  const VG = 12, HG = 46;
  const box = n => { if (!n._b) n._b = textBox(n.text, n === root); return n._b; };
  const subH = n => { const c = kids.get(n.id); const b = box(n); if (!c.length) return b.h; const s = c.reduce((a, k) => a + subH(k), 0) + VG * (c.length - 1); return Math.max(b.h, s); };
  const place = (n, cx, top, dir, branch) => {
    const b = box(n); const h = subH(n); const cy = top + h / 2;
    pos.set(n.id, { x: cx - b.w / 2, y: cy - b.h / 2, w: b.w, h: b.h, cx, cy, dir, branch, lines: b.lines, lh: b.lh });
    const c = kids.get(n.id); const sum = c.reduce((a, k) => a + subH(k), 0) + VG * (c.length - 1);
    let y = cy - sum / 2;
    for (const k of c) { const kb = box(k); place(k, cx + dir * (b.w / 2 + HG + kb.w / 2), y, dir, branch); y += subH(k) + VG; }
  };
  const rb = box(root);
  pos.set(root.id, { x: -rb.w / 2, y: -rb.h / 2, w: rb.w, h: rb.h, cx: 0, cy: 0, dir: 0, branch: null, lines: rb.lines, lh: rb.lh, root: true });
  for (const side of ["R", "L"]) {
    const dir = side === "R" ? 1 : -1;
    const c = kids.get(root.id).filter(k => (k.side || "R") === side);
    const sum = c.reduce((a, k) => a + subH(k), 0) + VG * 2 * (c.length - 1);
    let y = -sum / 2;
    for (const k of c) { const kb = box(k); place(k, dir * (rb.w / 2 + HG + 14 + kb.w / 2), y, dir, k.color ?? 0); y += subH(k) + VG * 2; }
  }
  for (const n of nodes) delete n._b;
  return { pos, kids, byId };
}

class MapView {
  constructor(pane, opts = {}) {
    this.pane = pane; this.readonly = !!opts.readonly; this.onChange = opts.onChange || (() => {});
    this.nodes = []; this.sel = null; this.tx = 0; this.ty = 0; this.k = 1; this.history = []; this.future = [];
    pane.insertAdjacentHTML("beforeend", `<svg xmlns="http://www.w3.org/2000/svg"><g class="vp"><g class="edges"></g><g class="nodes"></g></g></svg>
      <div class="zoom"><button class="btn sm" data-z="-" aria-label="縮小">−</button><button class="btn sm" data-z="fit">全体</button><button class="btn sm" data-z="+" aria-label="拡大">＋</button></div>`);
    this.svg = pane.querySelector("svg"); this.vp = pane.querySelector(".vp");
    pane.querySelector(".zoom").onclick = e => { const z = e.target.closest("[data-z]")?.dataset.z; if (z === "fit") this.fit(); else if (z) this.zoomAt(z === "+" ? 1.2 : 1 / 1.2); };
    this.bindPointer();
  }
  setNodes(nodes, keepView) { this.nodes = nodes.map(n => ({ ...n })); if (!this.nodes.find(n => n.id === this.sel)) this.sel = null; this.render(); if (!keepView) requestAnimationFrame(() => this.fit()); }
  color(n, p) { if (p.root) return cssVar("--accent"); return cssVar(BRANCH[(p.branch ?? 0) % BRANCH.length]); }
  render() {
    if (!this.nodes.length) return;
    this.L = layout(this.nodes);
    const { pos, byId } = this.L;
    let edges = "", nodes = "";
    for (const n of this.nodes) {
      const p = pos.get(n.id); if (!p) continue;
      const col = this.color(n, p);
      if (n.parent && pos.has(n.parent)) {
        const q = pos.get(n.parent);
        const x1 = q.cx + p.dir * q.w / 2, y1 = q.cy, x2 = p.cx - p.dir * p.w / 2, y2 = p.cy, mx = (x1 + x2) / 2;
        edges += `<path class="edge" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" stroke="${col}" ${byId.get(n.parent) === this.nodes[0] ? "" : 'stroke-opacity=".75" stroke-width="1.8"'}/>`;
      }
      const isTop = n.parent === this.nodes[0].id;
      const fill = p.root ? col : isTop ? mix(col, cssVar("--panel"), .14) : cssVar("--panel");
      const tx = p.lines.map((l, i) => `<tspan x="${p.cx}" y="${p.y + (p.root ? 12 : 7) + p.lh * (i + .5)}">${esc(l) || " "}</tspan>`).join("");
      nodes += `<g class="node ${p.root ? "root" : ""} ${n.id === this.sel ? "sel" : ""}" data-id="${esc(n.id)}">
        <rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="${p.root ? 14 : 8}" fill="${fill}" stroke="${p.root ? col : isTop ? col : cssVar("--line")}"/>
        <text text-anchor="middle" dominant-baseline="central" font-size="${p.root ? 17 : 14}" ${isTop ? 'font-weight="700"' : ""}>${tx}</text></g>`;
    }
    this.vp.querySelector(".edges").innerHTML = edges;
    this.vp.querySelector(".nodes").innerHTML = nodes;
    this.applyView();
  }
  applyView() { this.vp.setAttribute("transform", `translate(${this.tx},${this.ty}) scale(${this.k})`); }
  bounds() { let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity; for (const p of this.L.pos.values()) { x1 = Math.min(x1, p.x); y1 = Math.min(y1, p.y); x2 = Math.max(x2, p.x + p.w); y2 = Math.max(y2, p.y + p.h); } return { x1, y1, x2, y2 }; }
  fit() {
    if (!this.L) return; const r = this.svg.getBoundingClientRect(); if (!r.width) return;
    const b = this.bounds(); const pad = 40;
    this.k = Math.min(1.4, Math.max(.25, Math.min((r.width - pad * 2) / (b.x2 - b.x1), (r.height - pad * 2) / (b.y2 - b.y1))));
    this.tx = r.width / 2 - this.k * (b.x1 + b.x2) / 2; this.ty = r.height / 2 - this.k * (b.y1 + b.y2) / 2; this.applyView();
  }
  zoomAt(f, cx, cy) { const r = this.svg.getBoundingClientRect(); cx ??= r.width / 2; cy ??= r.height / 2; const nk = Math.min(3, Math.max(.2, this.k * f)); this.tx = cx - (cx - this.tx) * nk / this.k; this.ty = cy - (cy - this.ty) * nk / this.k; this.k = nk; this.applyView(); this.onView?.(); }
  ensureVisible(id) {
    const p = this.L?.pos.get(id); if (!p) return; const r = this.svg.getBoundingClientRect(); const m = 30;
    const sx1 = this.tx + p.x * this.k, sy1 = this.ty + p.y * this.k, sx2 = sx1 + p.w * this.k, sy2 = sy1 + p.h * this.k;
    if (sx1 < m) this.tx += m - sx1; else if (sx2 > r.width - m) this.tx -= sx2 - (r.width - m);
    if (sy1 < m) this.ty += m - sy1; else if (sy2 > r.height - m) this.ty -= sy2 - (r.height - m);
    this.applyView();
  }
  bindPointer() {
    const pts = new Map(); let pan = null, pinch = null, lastTap = { id: null, t: 0 };
    this.svg.addEventListener("pointerdown", e => {
      this.svg.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), k: this.k }; pan = null; return; }
      pan = { x: e.clientX, y: e.clientY, tx: this.tx, ty: this.ty, moved: false, node: e.target.closest(".node")?.dataset.id };
    });
    this.svg.addEventListener("pointermove", e => {
      if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pinch && pts.size === 2) { const [a, b] = [...pts.values()]; const r = this.svg.getBoundingClientRect(); this.zoomAt(pinch.k * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d / this.k, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top); return; }
      if (!pan) return; const dx = e.clientX - pan.x, dy = e.clientY - pan.y;
      if (!pan.moved && Math.hypot(dx, dy) > 4) { pan.moved = true; this.svg.classList.add("panning"); }
      if (pan.moved) { this.tx = pan.tx + dx; this.ty = pan.ty + dy; this.applyView(); this.onView?.(); }
    });
    const up = e => {
      pts.delete(e.pointerId); if (pts.size < 2) pinch = null;
      if (!pan) return; this.svg.classList.remove("panning");
      if (!pan.moved && !this.readonly) {
        const id = pan.node; const now = Date.now();
        if (id) { if (lastTap.id === id && now - lastTap.t < 350) { this.onEdit?.(id); lastTap = { id: null, t: 0 }; } else { this.select(id); lastTap = { id, t: now }; } }
        else this.select(null);
      }
      pan = null;
    };
    this.svg.addEventListener("pointerup", up); this.svg.addEventListener("pointercancel", up);
    this.svg.addEventListener("wheel", e => { e.preventDefault(); const r = this.svg.getBoundingClientRect(); if (e.ctrlKey || e.metaKey) this.zoomAt(Math.exp(-e.deltaY * .01), e.clientX - r.left, e.clientY - r.top); else { this.tx -= e.deltaX; this.ty -= e.deltaY; this.applyView(); this.onView?.(); } }, { passive: false });
  }
  select(id) { this.sel = id; this.render(); if (id) this.ensureVisible(id); this.onSelect?.(id); }
  // --- edits (all go through commit for undo + save) ---
  snapshot() { this.history.push(JSON.stringify(this.nodes)); if (this.history.length > 80) this.history.shift(); this.future = []; }
  commit() { this.render(); this.onChange(this.nodes); }
  undo() { if (!this.history.length) return; this.future.push(JSON.stringify(this.nodes)); this.nodes = JSON.parse(this.history.pop()); if (!this.nodes.find(n => n.id === this.sel)) this.sel = null; this.commit(); }
  redo() { if (!this.future.length) return; this.history.push(JSON.stringify(this.nodes)); this.nodes = JSON.parse(this.future.pop()); this.commit(); }
  get root() { return this.nodes[0]; }
  addChild(pid) {
    const p = this.nodes.find(n => n.id === pid) || this.root; this.snapshot();
    const n = { id: uid(), parent: p.id, text: "" };
    if (p === this.root) {
      const top = this.nodes.filter(x => x.parent === p.id);
      const r = top.filter(x => (x.side || "R") === "R").length, l = top.length - r;
      n.side = r <= l ? "R" : "L";
      const used = top.map(x => x.color ?? 0); n.color = [0, 1, 2, 3, 4, 5].find(c => !used.includes(c)) ?? top.length % BRANCH.length;
    }
    // insert after the parent's last descendant to keep order stable
    let idx = this.nodes.length; this.nodes.splice(idx, 0, n);
    this.sel = n.id; this.commit(); return n.id;
  }
  addSibling(id) {
    const cur = this.nodes.find(n => n.id === id); if (!cur || !cur.parent) return this.addChild(this.root.id);
    this.snapshot();
    const n = { id: uid(), parent: cur.parent, text: "" };
    if (cur.parent === this.root.id) { n.side = cur.side || "R"; const used = this.nodes.filter(x => x.parent === this.root.id).map(x => x.color ?? 0); n.color = [0, 1, 2, 3, 4, 5].find(c => !used.includes(c)) ?? 0; }
    this.nodes.splice(this.nodes.indexOf(cur) + 1, 0, n); this.sel = n.id; this.commit(); return n.id;
  }
  setText(id, text) { const n = this.nodes.find(x => x.id === id); if (!n || n.text === text) return; this.snapshot(); n.text = text; this.commit(); }
  removeNode(id) {
    const n = this.nodes.find(x => x.id === id); if (!n || !n.parent) return; this.snapshot();
    const gone = new Set([id]); let grew = true; while (grew) { grew = false; for (const x of this.nodes) if (x.parent && gone.has(x.parent) && !gone.has(x.id)) { gone.add(x.id); grew = true; } }
    const sibs = this.nodes.filter(x => x.parent === n.parent && !gone.has(x.id));
    this.nodes = this.nodes.filter(x => !gone.has(x.id));
    this.sel = sibs[0]?.id || n.parent; this.commit();
  }
  setColor(id, c) {
    let n = this.nodes.find(x => x.id === id); if (!n || !n.parent) return;
    while (n.parent !== this.root.id) n = this.nodes.find(x => x.id === n.parent);
    this.snapshot(); n.color = c; this.commit();
  }
  flipSide(id) {
    let n = this.nodes.find(x => x.id === id); if (!n || !n.parent) return;
    while (n.parent !== this.root.id) n = this.nodes.find(x => x.id === n.parent);
    this.snapshot(); n.side = (n.side || "R") === "R" ? "L" : "R"; this.commit();
  }
  move(id, delta) {
    const n = this.nodes.find(x => x.id === id); if (!n || !n.parent) return;
    const sibs = this.nodes.filter(x => x.parent === n.parent && (n.parent !== this.root.id || (x.side || "R") === (n.side || "R")));
    const i = sibs.indexOf(n), j = i + delta; if (j < 0 || j >= sibs.length) return;
    this.snapshot(); const other = sibs[j]; const a = this.nodes.indexOf(n), b = this.nodes.indexOf(other);
    [this.nodes[a], this.nodes[b]] = [this.nodes[b], this.nodes[a]]; this.commit();
  }
  nav(key) {
    if (!this.sel) { this.select(this.root.id); return; }
    const p = this.L.pos.get(this.sel); const n = this.nodes.find(x => x.id === this.sel);
    const kids = this.L.kids.get(this.sel) || [];
    let target = null;
    const outward = d => p.root ? kids.filter(k => (k.side || "R") === (d > 0 ? "R" : "L"))[0] : kids[0];
    if (key === "ArrowRight") target = p.root ? outward(1) : p.dir > 0 ? kids[0] : n.parent && this.nodes.find(x => x.id === n.parent);
    if (key === "ArrowLeft") target = p.root ? outward(-1) : p.dir < 0 ? kids[0] : n.parent && this.nodes.find(x => x.id === n.parent);
    if (key === "ArrowUp" || key === "ArrowDown") {
      // nearest node vertically in the same column
      let best = null, bd = Infinity;
      for (const [id, q] of this.L.pos) { if (id === this.sel) continue; const dy = q.cy - p.cy; if (key === "ArrowUp" ? dy >= 0 : dy <= 0) continue; const d = Math.abs(dy) + Math.abs(q.cx - p.cx) * 2; if (d < bd) { bd = d; best = id; } }
      target = best && this.nodes.find(x => x.id === best);
    }
    if (target) this.select(target.id);
  }
  screenRect(id) { const p = this.L.pos.get(id); const r = this.pane.getBoundingClientRect(); const s = this.svg.getBoundingClientRect(); return { left: s.left - r.left + this.tx + p.x * this.k, top: s.top - r.top + this.ty + p.y * this.k, w: p.w * this.k, h: p.h * this.k, root: !!p.root }; }
  toSVGString() {
    const b = this.bounds(); const pad = 30; const w = b.x2 - b.x1 + pad * 2, h = b.y2 - b.y1 + pad * 2;
    let inner = this.vp.innerHTML.replace(/class="node sel/g, 'class="node');
    const css = `.edge{fill:none;stroke-width:2.4;stroke-linecap:round}.node text{font-family:"Hiragino Sans","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;fill:${cssVar("--ink")}}.node.root text{font-weight:700;fill:${cssVar("--panel")}}.node rect{stroke-width:1.5}`;
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="${b.x1 - pad} ${b.y1 - pad} ${w} ${h}"><style>${css}</style><rect x="${b.x1 - pad}" y="${b.y1 - pad}" width="${w}" height="${h}" fill="${cssVar("--canvas")}"/>${inner}</svg>`;
  }
}

// ---------- editor ----------
let editor = null;
function openEditor(mapId, initial) {
  const m = initial || state.maps.find(x => x.id === mapId); if (!m) return;
  const s = state.students.find(x => x.id === m.studentId) || {};
  const root = $("#editorRoot");
  const prevMaps = mapsOf(m.studentId).filter(x => x.id !== m.id && (x.session ?? 0) <= (m.session ?? 0));
  const prev = prevMaps[prevMaps.length - 1];
  root.innerHTML = `<div class="editor" id="editor">
    <div class="ed-top">
      <div class="ed-title"><button class="btn sm" id="ed-back">← 戻る</button>
        <input id="ed-name" value="${esc(m.title || kindLabel(m))}" aria-label="マップ名"><span class="who">${esc(s.name || "")}さん</span>
        <input id="ed-date" type="date" value="${esc(m.date || "")}" aria-label="日付" style="font-family:var(--font-body);font-weight:400;font-size:13px;flex:0 0 auto;width:auto"></div>
      <div class="ed-tools">
        <button class="btn sm" id="t-child" title="Tab">＋ 子項目</button>
        <button class="btn sm" id="t-sib" title="Enter">＋ 同じ階層</button>
        <button class="btn sm" id="t-edit" title="ダブルクリック / F2">編集</button>
        <button class="btn sm danger" id="t-del" title="Delete">削除</button>
        <span class="swatches" id="t-colors">${BRANCH.map((v, i) => `<button style="background:var(${v})" data-c="${i}" aria-label="色${i + 1}" title="枝の色"></button>`).join("")}</span>
        <button class="btn sm" id="t-flip" title="枝を左右に移動">左右</button>
        <span class="sep"></span>
        <button class="btn sm" id="t-undo" title="Ctrl+Z">元に戻す</button>
        <button class="btn sm" id="t-redo" title="Ctrl+Shift+Z">やり直す</button>
        <span class="sep"></span>
        <button class="btn sm" id="t-prev" ${prev ? "" : "disabled"} title="${prev ? esc(prev.title || kindLabel(prev)) : "比較できる前のマップがありません"}">前回と比較</button>
        <button class="btn sm" id="t-png">画像で保存</button>
        <button class="btn sm danger" id="t-delmap">マップ削除</button>
        <span class="save-state" id="ed-save">保存済み</span>
      </div>
    </div>
    <div class="ed-body" id="ed-body"><div class="pane" id="pane-main">
      <div class="hint">ダブルクリックで編集 ・ Tab：子項目 ・ Enter：同じ階層 ・ Delete：削除 ・ 矢印キー：移動 ・ Alt+↑↓：並べ替え ・ ドラッグで移動、Ctrl+ホイールで拡大</div>
    </div></div></div>`;

  const ed = { mapId: m.id, rev: m.rev, dirty: false, saving: false, timer: null, editing: null, prevView: null };
  editor = ed;
  const saveEl = $("#ed-save");
  const setSave = (t, err) => { saveEl.textContent = t; saveEl.classList.toggle("err", !!err); };
  const view = new MapView($("#pane-main"), { onChange: () => schedule() });
  ed.view = view;
  view.setNodes(Array.isArray(m.nodes) && m.nodes.length ? m.nodes : tplNodes("free", s, 0));

  function schedule() { ed.dirty = true; setSave("未保存…"); clearTimeout(ed.timer); ed.timer = setTimeout(flush, 700); }
  async function flush() {
    clearTimeout(ed.timer);
    if (!ed.dirty) return;
    if (ed.saving) { ed.timer = setTimeout(flush, 300); return; }
    ed.saving = true; ed.dirty = false; setSave("保存中…");
    ed.rev = uid();
    const data = { nodes: view.nodes.map(({ id, parent, text, color, side }) => { const o = { id, parent, text }; if (color != null) o.color = color; if (side) o.side = side; return o; }), title: $("#ed-name").value.trim() || kindLabel(m), date: $("#ed-date").value, rev: ed.rev, updatedAt: Date.now() };
    try { await write("maps/" + m.id, data, "update"); setSave(ed.dirty ? "未保存…" : "保存済み"); }
    catch (err) { ed.dirty = true; setSave("保存できませんでした", true); setStatus("マップを保存できませんでした（" + (err.code || err.message) + "）。通信状況を確認して、もう一度編集すると再保存されます。", true); if (err.code === "quota_exceeded") setSave("容量上限です", true); }
    finally { ed.saving = false; }
  }
  ed.flush = flush;
  ed.onRemote = () => {
    const r = state.maps.find(x => x.id === m.id);
    if (!r) { setSave("このマップは削除されました", true); return; }
    if (r.rev !== ed.rev && !ed.dirty && !ed.saving && !ed.editing) { ed.rev = r.rev; view.setNodes(r.nodes || [], true); $("#ed-name").value = r.title || ""; $("#ed-date").value = r.date || ""; }
  };

  // inline text editing
  function startEdit(id) {
    if (ed.editing) return;
    const node = view.nodes.find(n => n.id === id); if (!node) return;
    view.select(id);
    const rc = view.screenRect(id);
    const ta = document.createElement("textarea"); ta.className = "node-edit"; ta.id = "node-edit"; ta.value = node.text;
    ta.style.left = rc.left - 4 + "px"; ta.style.top = rc.top - 4 + "px"; ta.style.minWidth = Math.max(140, rc.w + 8) + "px"; ta.style.width = Math.max(140, rc.w + 8) + "px";
    const fit = () => { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; const w = Math.min(420, Math.max(140, ...ta.value.split("\n").map(l => textBox(l).w + 24))); ta.style.width = w + "px"; };
    $("#pane-main").appendChild(ta); ed.editing = { id, ta };
    fit(); ta.focus(); ta.select();
    ta.addEventListener("input", fit);
    let done = false;
    const finish = (save, then) => {
      if (done) return; done = true;
      const val = ta.value.replace(/\s+$/, "");
      ta.remove(); ed.editing = null;
      if (save) {
        if (!val && node.parent && !node.text) view.removeNode(id);
        else view.setText(id, val || node.text);
      } else if (!node.text && node.parent) { view.removeNode(id); }
      if (then === "child") startEdit(view.addChild(id));
      else if (then === "sib") startEdit(view.addSibling(id));
      else $("#editor")?.focus();
    };
    ta.addEventListener("keydown", e => {
      if (e.isComposing || e.keyCode === 229) return;
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); finish(true, ta.value.trim() ? "sib" : null); }
      else if (e.key === "Tab") { e.preventDefault(); finish(true, ta.value.trim() ? "child" : null); }
      else if (e.key === "Escape") { e.preventDefault(); finish(true, null); }
      e.stopPropagation();
    });
    ta.addEventListener("blur", () => finish(true));
  }
  view.onEdit = startEdit;
  view.onView = () => { if (ed.editing) ed.editing.ta.blur(); };

  const edEl = $("#editor"); edEl.tabIndex = -1; edEl.focus();
  const sel = () => view.sel || view.root.id;
  $("#t-child").onclick = () => startEdit(view.addChild(sel()));
  $("#t-sib").onclick = () => startEdit(view.addSibling(sel()));
  $("#t-edit").onclick = () => startEdit(sel());
  $("#t-del").onclick = () => view.sel && view.removeNode(view.sel);
  $("#t-flip").onclick = () => view.sel && view.flipSide(view.sel);
  $("#t-undo").onclick = () => view.undo();
  $("#t-redo").onclick = () => view.redo();
  $("#t-colors").onclick = e => { const c = e.target.closest("[data-c]"); if (c && view.sel) view.setColor(view.sel, +c.dataset.c); };
  $("#ed-name").oninput = schedule; $("#ed-date").onchange = schedule;
  $("#ed-name").onkeydown = e => { if (e.key === "Enter") e.target.blur(); e.stopPropagation(); };
  $("#ed-date").onkeydown = e => e.stopPropagation();
  edEl.addEventListener("keydown", e => {
    if (ed.editing || e.target.matches("input, textarea")) return;
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.key.toLowerCase() === "z") { e.preventDefault(); e.shiftKey ? view.redo() : view.undo(); return; }
    if (mod && e.key.toLowerCase() === "y") { e.preventDefault(); view.redo(); return; }
    if (e.key === "Tab") { e.preventDefault(); startEdit(view.addChild(sel())); }
    else if (e.key === "Enter") { e.preventDefault(); startEdit(view.sel && view.sel !== view.root.id ? view.addSibling(view.sel) : view.addChild(view.root.id)); }
    else if (e.key === "F2" || e.key === " ") { e.preventDefault(); startEdit(sel()); }
    else if ((e.key === "Delete" || e.key === "Backspace") && view.sel) { e.preventDefault(); view.removeNode(view.sel); }
    else if (e.altKey && (e.key === "ArrowUp" || e.key === "ArrowDown") && view.sel) { e.preventDefault(); view.move(view.sel, e.key === "ArrowUp" ? -1 : 1); }
    else if (e.key.startsWith("Arrow")) { e.preventDefault(); view.nav(e.key); }
    else if (e.key === "Escape") { view.select(null); }
  });

  // compare with previous map
  $("#t-prev").onclick = () => {
    const body = $("#ed-body");
    if (ed.prevView) { ed.prevView.pane.remove(); ed.prevView = null; body.classList.remove("split"); $("#t-prev").textContent = "前回と比較"; requestAnimationFrame(() => view.fit()); return; }
    const pane = document.createElement("div"); pane.className = "pane";
    pane.innerHTML = `<span class="pane-label">${esc(prev.title || kindLabel(prev))} ・ ${esc(fmtDate(prev.date))}（閲覧のみ）</span>`;
    body.appendChild(pane); body.classList.add("split");
    ed.prevView = new MapView(pane, { readonly: true }); ed.prevView.setNodes(prev.nodes || []);
    $("#t-prev").textContent = "比較を閉じる"; requestAnimationFrame(() => view.fit());
  };

  // PNG export
  $("#t-png").onclick = async () => {
    if (!state.downloads) { setSave("この画面では保存できません", true); return; }
    try {
      const svg = view.toSVGString();
      const img = new Image(); const url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));
      await new Promise((ok, ng) => { img.onload = ok; img.onerror = ng; img.src = url; });
      const scale = 2; const c = document.createElement("canvas"); c.width = img.width * scale; c.height = img.height * scale;
      const ctx = c.getContext("2d"); ctx.scale(scale, scale); ctx.drawImage(img, 0, 0); URL.revokeObjectURL(url);
      const blob = await new Promise(r => c.toBlob(r, "image/png"));
      const name = `${s.name || "生徒"}_${$("#ed-name").value || kindLabel(m)}_${$("#ed-date").value || today()}.png`.replace(/[\\/:*?"<>|]/g, "_");
      await state.downloads.save({ filename: name, data: blob });
    } catch (err) { if (err?.code !== "declined") setSave("画像を作れませんでした", true); }
  };

  // delete map (two-step)
  let armed = false;
  $("#t-delmap").onclick = async e => {
    const b = e.currentTarget;
    if (!armed) { armed = true; b.classList.add("armed"); b.textContent = "本当に削除"; setTimeout(() => { armed = false; b.classList.remove("armed"); b.textContent = "マップ削除"; }, 4000); return; }
    clearTimeout(ed.timer); ed.dirty = false;
    try { await remove("maps/" + m.id); closeEditor(true); setStatus("マップを削除しました。"); }
    catch (err) { setSave("削除できませんでした", true); }
  };

  $("#ed-back").onclick = () => closeEditor();
  addEventListener("resize", ed.onResize = () => { view.fit(); ed.prevView?.fit(); });
}
async function closeEditor(skipSave) {
  if (!editor) return; const ed = editor;
  if (ed.editing) ed.editing.ta.blur();
  if (!skipSave) await ed.flush();
  removeEventListener("resize", ed.onResize);
  editor = null; $("#editorRoot").innerHTML = ""; renderAll();
}
addEventListener("beforeunload", () => { if (editor && editor.dirty) editor.flush(); });
document.fonts?.ready.then(() => { editor?.view.render(); editor?.view.fit(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && editor) editor.flush(); });

boot();
</script>
